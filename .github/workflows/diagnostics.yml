name: Inspect ISO build diagnostics
on:
  push:
    branches: [ci/active-logs]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ISO workflow run ID (empty selects the latest failed run)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Try reading the active build log with the runner's read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          if gh api repos/zerob13/SumOS/actions/jobs/128781465683/logs > diagnostics/active-build.log; then
            python3 scripts/ci-diagnostics.py diagnostics/active-build.log
          else
            echo '::notice::GitHub has not made the active job log available.'
          fi
      - name: Download retained diagnostics and surface the failure
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [[ -z "$DIAG_RUN_ID" ]]; then
            DIAG_RUN_ID=$(gh run list --workflow iso.yml --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [[ "$DIAG_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'No failed ISO run found'; exit 1; }
          echo "Inspecting run $DIAG_RUN_ID"
          gh run download "$DIAG_RUN_ID" --name sumos-build-diagnostics --dir diagnostics
          find diagnostics -type f -name '*.log' -print0 | xargs -0 -r python3 scripts/ci-diagnostics.py
          python3 scripts/ci-image-diagnostics.py diagnostics
