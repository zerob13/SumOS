name: Check ISO test hardware acceleration
on:
  push:
    branches: [ci/active-logs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check whether QEMU can use KVM without elevated permissions
        run: |
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo '::notice::KVM is accessible to the runner user'
          else
            echo '::notice::KVM is unavailable to the runner user; software emulation is required'
          fi
