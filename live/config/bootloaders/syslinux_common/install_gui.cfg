label installstart
    menu label ^Install SumOS (graphical)
    linux @KERNEL_GI@
    initrd @INITRD_GI@
    append vga=788 @APPEND_INSTALL@ --- quiet

label installtext
    menu label Install SumOS (text)
    linux @KERNEL_DI@
    initrd @INITRD_DI@
    append vga=normal @APPEND_INSTALL@ --- quiet
